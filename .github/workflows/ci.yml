name: Campus Booking Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: campus_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/campus_booking_test?schema=public
      DIRECT_URL: postgresql://postgres:postgrespassword@localhost:5432/campus_booking_test?schema=public
      JWT_SECRET: ci-jwt-secret-must-be-at-least-32-characters-long
      CHECKIN_TOKEN_SECRET: ci-checkin-secret-must-be-32-chars-min
      RESOURCE_SECRET_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CRON_SECRET: ci-cron-secret-value
      ENABLE_DEMO_LOGIN: "true"
      NEXT_PUBLIC_ENABLE_DEMO_LOGIN: "true"
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Validate & migrate Prisma schema
        run: |
          npx prisma validate --schema=apps/web/prisma/schema.prisma
          npx prisma migrate deploy --schema=apps/web/prisma/schema.prisma
          npx prisma generate --schema=apps/web/prisma/schema.prisma

      - name: Seed database
        run: npm run db:seed

      - name: TypeScript typecheck & production builds
        run: |
          npx tsc --noEmit -p apps/web/tsconfig.json
          npm run build -w apps/web
          npm run build -w apps/admin

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Start production web server & run R1-R10 backend + Playwright suites
        run: |
          npm run start -w apps/web &
          SERVER_PID=$!
          npx wait-on http://localhost:3000/login -t 60000 || (sleep 10)
          cd apps/web
          npx tsx test/r10-concurrency-security.test.ts
          npx playwright test
          kill $SERVER_PID || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
